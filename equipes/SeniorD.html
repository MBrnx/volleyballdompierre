<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Senior A</title>
    <link rel="stylesheet" href="../styles.css">
    <script defer src="../script-equipe.js"></script>
    <style>
    .btn {
        display: inline-block;
        padding: 10px 15px;
        background-color: #198754;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        margin-top: 20px;
    }

    .btn:hover {
        background-color: rgb(0, 112, 25)
    }

    .team-header {
        display: flex;
        align-items: flex-start;
        gap: 20px;
        margin-top: 20px;
    }

    .team-photo {
        width: 350px;
        border-radius: 10px;
        object-fit: cover;
    }

    .team-info-text {
            flex: 1;
        }

        #players-list li {
        padding: 8px 0;
        border-bottom: 1px solid #198754;
    }

    #players-list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px 20px;
        list-style: none;
        padding-left: 0;
    }

    #players-list li:last-child {
        border-bottom: none;
    }


    @media (max-width: 768px) {
        .team-header {
            flex-direction: column;
            text-align: center;
        }

        .team-photo {
            width: 100%;
            max-width: 350px;
            margin: 0 auto;
        }
    }

</style>
</head>
<body>

<h1 id="team-name" data-team="Dompierre D" style="text-align: center;">Sénior D (H)</h1>

<section id="team-header" class="team-header">
    <img src="../images/hommes_seniorD.webp" alt="Senior D" class="team-photo" id="team-photo">
    
    <div class="team-info-text">
        <h2>Informations</h2>
        <p><strong>Coach :</strong> <span id="coach"></span></p>
        <p><strong>Matchs joués :</strong> <span id="matches"></span></p>
        <p><strong>Victoires :</strong> <span id="wins"></span></p>
        <p><strong>Défaites :</strong> <span id="losses"></span></p>
        <p><strong>Pourcentage de victoire :</strong> <span id="winrate"></span></p>
    </div>

</section>

<section id="players">
    <h2>Joueurs</h2>
    <ul id="players-list"></ul>
</section>


<a href="../equipe.html" class="btn btn-primary" style="display: block; margin: 20px auto; text-align: center; width: 20%;">Retour aux équipes</a>
</body>
</html>
