<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Senior D</title>

    <!-- Styles -->
    <link rel="stylesheet" href="../styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7SFZM9TDFM"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){ dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-7SFZM9TDFM');
    </script>

    <!-- Script équipe -->
    <script defer src="../script.js"></script>
    <script defer src="../script-equipe.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>
    .btn-retour {
        display: block;
        width: 140px; /* largeur fixe */
        margin: 20px auto;
        background: #198754;
        color: white;
        padding: 10px 15px;
        border-radius: 8px;
        text-align: center;
        line-height: 1.3;
        font-weight: 500;
        text-decoration: none;
    }

    .btn:hover {
        background-color: rgb(0, 112, 25)
    }

    .team-header {
        display: flex;
        align-items: flex-start;
        gap: 20px;
        margin-top: 20px;
    }

    .team-photo {
        width: 350px;
        border-radius: 10px;
        object-fit: cover;
    }

    .team-info-text {
            flex: 1;
        }

        #players-list li {
        padding: 8px 0;
        border-bottom: 1px solid #198754;
    }

    #players-list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px 20px;
        list-style: none;
        padding-left: 0;
    }

    #players-list li:last-child {
        border-bottom: none;
    }


    @media (max-width: 768px) {

        body {
            background-attachment: scroll !important;
            background-size: 120% !important; /* optionnel, pour garder un bon rendu */
        }
    
        .team-header {
            flex-direction: column;
            text-align: center;
            gap: 10px;
        }

        .team-photo {
            width: 100%;
            max-width: 350px;
            margin: 0 auto;
        }

        .team-info-text {
            width: 100%;
            text-align: center;
        }

        #players-list {
            grid-template-columns: 1fr !important;
            gap: 10px;
        }

        #players-list li {
            border-bottom: 1px solid #198754;
            padding: 10px 0;
        }
    }


</style>
</head>
<body>

<!-- Navbar -->
<header>
    <div id="navbar-placeholder"></div>
</header>

<main>

<h1 id="team-name" data-team="Dompierre D" style="text-align: center;">Sénior D (H)</h1>

<section id="team-header" class="team-header">
    <img src="../images/hommes_seniorD.webp" alt="Senior D" class="team-photo" id="team-photo">
    
    <div class="team-info-text">
        <h2>Informations</h2>
        <p><strong>Coach :</strong> <span id="coach"></span></p>
        <p><strong>Matchs joués :</strong> <span id="matches"></span></p>
        <p><strong>Victoires :</strong> <span id="wins"></span></p>
        <p><strong>Défaites :</strong> <span id="losses"></span></p>
        <p><strong>Pourcentage de victoire :</strong> <span id="winrate"></span></p>
    </div>

</section>

<section id="players">
    <h2>Joueurs</h2>
    <ul id="players-list"></ul>
</section>

<a href="../equipe.html" class="btn-retour">Retour aux équipes</a>

</main>

<!-- Footer -->
<footer>
    <div id="footer-placeholder"></div>
</footer>

<button id="back-to-top" title="Retour en haut">
    <svg class="progress-ring" width="60" height="60">
      <circle class="progress-ring__background" cx="30" cy="30" r="26" />
      <circle class="progress-ring__circle" cx="30" cy="30" r="26" />
    </svg>
    <span>&#8679;</span>
</button>

<div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content bg-transparent border-0">
        <img id="modalImage" src="" class="img-fluid rounded">
      </div>
    </div>
</div>

</body>
</html>
