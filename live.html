    <style>
        /* ── Palette & tokens ── */
        :root {
            --yt-red:    #FF0000;
            --yt-dark:   #0f0f0f;
            --green:     #198754;
            --green-lt:  #e9f5ef;
            --card-bg:   #ffffff;
            --muted:     #6c757d;
            --radius:    12px;
            --shadow:    0 4px 16px rgba(0,0,0,.10);
        }

        /* ── Page header ── */
        .live-hero {
            background: linear-gradient(135deg, #198754 0%, #0d5c38 100%);
            color: #fff;
            padding: 2.5rem 1rem 2rem;
            text-align: center;
            border-radius: 0 0 var(--radius) var(--radius);
            margin-bottom: 2rem;
        }
        .live-hero h1 {
            font-size: clamp(1.4rem, 4vw, 2.2rem);
            font-weight: 700;
            margin-bottom: .4rem;
        }
        .live-hero p { opacity: .85; margin: 0; }

        /* ── Status badge ── */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }
        .badge-live {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--yt-red);
            color: #fff;
            font-weight: 700;
            font-size: .85rem;
            letter-spacing: .05em;
            padding: 4px 12px;
            border-radius: 20px;
        }
        .badge-live .dot {
            width: 8px; height: 8px;
            background: #fff;
            border-radius: 50%;
            animation: blink 1.2s ease-in-out infinite;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

        /* ── Lecteur principal ── */
        .main-player-wrap {
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            background: #000;
            margin-bottom: 1.25rem;
        }
        .main-player-wrap .ratio { border-radius: var(--radius); overflow: hidden; }

        /* ── Titre du live actif ── */
        .main-player-label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: .6rem 0;
            margin-bottom: .5rem;
        }
        .main-player-label .team-name {
            font-weight: 700;
            font-size: 1.05rem;
            color: #212529;
        }
        .main-player-label .live-pill {
            background: var(--yt-red);
            color: #fff;
            font-size: .7rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            letter-spacing: .08em;
        }

        /* ── Miniatures ── */
        .thumbs-row {
            display: flex;
            gap: .75rem;
            overflow-x: auto;
            padding-bottom: .5rem;
            scrollbar-width: thin;
        }
        .thumb-card {
            flex: 0 0 180px;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            background: var(--card-bg);
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
            transition: border-color .2s, transform .15s;
        }
        .thumb-card:hover   { transform: translateY(-2px); border-color: var(--green); }
        .thumb-card.active  { border-color: var(--yt-red); }
        .thumb-card iframe  { display: block; width: 100%; height: 100px; pointer-events: none; }
        .thumb-label {
            padding: 6px 8px;
            font-size: .78rem;
            font-weight: 600;
            color: #212529;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .thumb-label .mini-pill {
            background: var(--yt-red);
            color: #fff;
            font-size: .65rem;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 4px;
        }

        /* ── Aucun live ── */
        .no-live-box {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 3rem 1.5rem;
            text-align: center;
            color: var(--muted);
        }
        .no-live-box .icon { font-size: 3rem; margin-bottom: .75rem; }
        .no-live-box h3 { color: #212529; font-weight: 700; margin-bottom: .4rem; }

        /* ── Liens chaînes ── */
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: .75rem;
            margin-top: 1.5rem;
        }
        .channel-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: .75rem 1rem;
            border-radius: 10px;
            background: var(--green-lt);
            color: var(--green);
            font-weight: 600;
            font-size: .88rem;
            text-decoration: none;
            border: 1.5px solid transparent;
            transition: border-color .2s, background .2s;
        }
        .channel-link:hover {
            border-color: var(--green);
            background: #d4edda;
            color: var(--green);
        }
        .channel-link .yt-icon { flex-shrink: 0; }

        /* ── Spinner ── */
        .spinner-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
        }
        .spinner-border { color: var(--green); }

        /* ── Responsive ── */
        @media (max-width: 576px) {
            .thumb-card { flex: 0 0 150px; }
            .thumb-card iframe { height: 85px; }
        }
    </style>
</head>

<body>
<header>
    <div id="navbar-placeholder"></div>
</header>

<div class="live-hero">
    <h1>🔴 Matchs en direct</h1>
    <p>Suivez nos équipes en live sur YouTube</p>
</div>

<main class="container pb-5">

    <!-- Zone chargement -->
    <div id="live-loading" class="spinner-wrap">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Chargement…</span>
        </div>
    </div>

    <!-- Zone lives actifs (masquée au départ) -->
    <section id="live-section" style="display:none;" aria-labelledby="live-heading">
        <div class="status-bar">
            <div class="badge-live"><span class="dot"></span> LIVE EN COURS</div>
            <span id="live-count-label" class="text-muted small"></span>
        </div>

        <!-- Lecteur principal -->
        <div class="main-player-label">
            <span class="team-name" id="main-team-name"></span>
            <span class="live-pill">LIVE</span>
        </div>
        <div class="main-player-wrap">
            <div class="ratio ratio-16x9">
                <iframe id="main-player"
                        src=""
                        title="Live YouTube"
                        frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen>
                </iframe>
            </div>
        </div>

        <!-- Miniatures (visibles seulement si > 1 live) -->
        <div id="thumbs-container" class="thumbs-row" style="display:none;"></div>
    </section>

    <!-- Zone aucun live (masquée au départ) -->
    <section id="no-live-section" style="display:none;" aria-labelledby="no-live-heading">
        <div class="no-live-box">
            <div class="icon">📺</div>
            <h3 id="no-live-heading">Aucun live en ce moment</h3>
            <p class="mb-4">Revenez lors d'un jour de match ou abonnez-vous à nos chaînes pour être notifié.</p>

            <div class="channels-grid" id="channels-grid"></div>
        </div>
    </section>

    <section aria-labelledby="youtube-live-title" class="mt-5">
        <h2 id="youtube-live-title" class="text-center mb-4">YouTube – VolleyBall Dompierre</h2>

            <div class="text-center">
                <a href="https://www.youtube.com/@VolleyBallDompierresurHelpe"
                target="_blank"
                rel="noopener"
                class="btn btn-danger btn-lg">
                    ▶️ Aller sur la chaîne YouTube
                </a>
            </div>
        </div>
    </section>


</main>

<footer>
    <div id="footer-placeholder"></div>
</footer>

<button id="back-to-top" title="Retour en haut">
    <svg class="progress-ring" width="60" height="60">
        <circle class="progress-ring__background" cx="30" cy="30" r="26"/>
        <circle class="progress-ring__circle" cx="30" cy="30" r="26"/>
    </svg>
    <span>&#8679;</span>
</button>

<script>
// ── Configuration des chaînes ──────────────────────────────────────────────
const API_KEY = "AIzaSyCDXVrJnLwEOGTcJeRtvBJK-MsWx2bi0lw";

const CHANNELS = [
    { id: "UC5s-uZuZifwvuuVujHY6ePQ", name: "Sénior A",         url: "https://www.youtube.com/@VolleyBallDompierresurHelpeA" },
    { id: "UC2ZTwbLwwcxfIThKBoJGc7g", name: "Sénior B",         url: "https://www.youtube.com/@VolleyBallDompierresurHelpeB" },
    { id: "UCRk46QoaBZQPx38D1YX5UVA", name: "Sénior C",         url: "https://www.youtube.com/@VolleyBallDompierresurHelpeC" },
    { id: "UCYG_J9PXD-oR5vzEMb8SW6g", name: "Sénior D",         url: "https://www.youtube.com/@VolleyBallDompierresurHelpeD" },
    { id: "UCfSWqmK7M_fRx67tOPLq7XQ", name: "Sénior Féminines", url: "https://www.youtube.com/@VolleyBallDompierresurHelpeFe" },
];

// ── Helpers ────────────────────────────────────────────────────────────────
function embedUrl(videoId) {
    return `https://www.youtube.com/embed/${videoId}?autoplay=0&rel=0`;
}

function buildChannelLinks() {
    const grid = document.getElementById("channels-grid");
    CHANNELS.forEach(ch => {
        const a = document.createElement("a");
        a.href = ch.url;
        a.target = "_blank";
        a.rel = "noopener";
        a.className = "channel-link";
        a.innerHTML = `
            <svg class="yt-icon" width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8z" fill="#FF0000"/>
                <path d="M9.7 15.5l6.3-3.5-6.3-3.5v7z" fill="#fff"/>
            </svg>
            ${ch.name}
        `;
        grid.appendChild(a);
    });
}

// ── Lecture d'un live dans le lecteur principal ────────────────────────────
let currentVideoId = null;

function loadMain(videoId, teamName) {
    currentVideoId = videoId;
    document.getElementById("main-player").src = embedUrl(videoId);
    document.getElementById("main-team-name").textContent = teamName;

    // Met à jour l'état actif sur les miniatures
    document.querySelectorAll(".thumb-card").forEach(c => {
        c.classList.toggle("active", c.dataset.videoId === videoId);
    });
}

// ── Miniatures ─────────────────────────────────────────────────────────────
function buildThumbs(lives) {
    const container = document.getElementById("thumbs-container");
    container.innerHTML = "";

    lives.forEach(live => {
        const card = document.createElement("div");
        card.className = "thumb-card" + (live.videoId === currentVideoId ? " active" : "");
        card.dataset.videoId = live.videoId;

        card.innerHTML = `
            <iframe
                src="https://www.youtube.com/embed/${live.videoId}?mute=1&autoplay=0&controls=0&rel=0"
                frameborder="0"
                tabindex="-1"
                aria-hidden="true">
            </iframe>
            <div class="thumb-label">
                <span>${live.channelName}</span>
                <span class="mini-pill">LIVE</span>
            </div>
        `;

        card.addEventListener("click", () => loadMain(live.videoId, live.channelName));
        container.appendChild(card);
    });
}

// ── Vérification des lives ─────────────────────────────────────────────────
async function checkAllLives() {
    const lives = [];

    await Promise.all(CHANNELS.map(async ch => {
        try {
            const url = `https://www.googleapis.com/youtube/v3/search`
                + `?part=snippet&channelId=${ch.id}&eventType=live&type=video&key=${API_KEY}`;
            const res  = await fetch(url);
            const data = await res.json();

            if (data.items && data.items.length > 0) {
                lives.push({
                    videoId:     data.items[0].id.videoId,
                    channelName: ch.name,
                    channelId:   ch.id,
                });
            }
        } catch (e) {
            console.warn(`Erreur chaîne ${ch.name}:`, e);
        }
    }));

    return lives;
}

// ── Init ───────────────────────────────────────────────────────────────────
async function init() {
    buildChannelLinks();

    const lives = await checkAllLives();

    document.getElementById("live-loading").style.display = "none";

    if (lives.length === 0) {
        document.getElementById("no-live-section").style.display = "block";
        return;
    }

    // Au moins 1 live
    document.getElementById("live-section").style.display = "block";

    const countLabel = document.getElementById("live-count-label");
    countLabel.textContent = lives.length === 1
        ? "1 équipe en direct"
        : `${lives.length} équipes en direct simultanément`;

    // Charger le 1er live dans le lecteur principal
    loadMain(lives[0].videoId, lives[0].channelName);

    // Afficher les miniatures seulement si plusieurs lives
    if (lives.length > 1) {
        buildThumbs(lives);
        document.getElementById("thumbs-container").style.display = "flex";
    }
}

init();
</script>

<script src="script.js"></script>
</body>
</html>
